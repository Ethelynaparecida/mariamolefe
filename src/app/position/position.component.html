<div class="position-container">

  <div *ngIf="isLoading" class="status-card loading">
    <div class="spinner"></div>
    <p>A verificar a sua posição na fila...</p>
    <button class="btn-logout" (click)="fazerLogout()">Sair e remover música da fila</button>
  </div>



  <h3>Olá, {{ usuarioNome }}!</h3>

  <div *ngIf="cancelMessage" class="alert-card cancelada" role="alert">
    <span class="alert-tag" aria-hidden="true">!</span>
    <p><strong>Aviso:</strong> {{ cancelMessage }}</p>
  </div>

  <div [ngSwitch]="posicao" class="status-card">

    <div *ngIf="canReplaceSong" class="replace-song-row">
      <button class="btn-trocar-musica" type="button" (click)="trocarMusica()">
        Trocar música
      </button>
    </div>

    <div *ngSwitchDefault class="status-fila">
      <p>Você está na fila!</p>
      <div class="posicao-numero">{{ posicao }}</div>
      <p class="legenda">é a sua posição</p>
    </div>

    <div *ngSwitchCase="1" class="status-fila proximo">
      <p>Prepare-se!</p>
      <div class="posicao-numero">VOCÊ É O PRÓXIMO!</div>
    </div>

    <div *ngSwitchCase="0" class="status-fila tocando">
      <p>Chegou a sua vez!</p>
      <div class="posicao-numero">A SUA MÚSICA ESTÁ A TOCAR!</div>
    </div>

    <div *ngSwitchCase="-1" class="status-fila tocado">
      <p>A sua música foi removida da fila.</p>
      <div class="posicao-numero">🎤</div>
      <p>Obrigado por participar.</p>

      <button class="btn-adicionar" (click)="adicionarOutraMusica()">
        Adicionar Outra Música
      </button>
    </div>

  </div>

  <button class="btn-logout" (click)="fazerLogout()">Sair e remover música da fila</button>
</div>
